# Caddy, the web server with automatic HTTPS, from its own release
# tarball: the one static binary. bin/caddy is a wrapper that points
# XDG_DATA_HOME and XDG_CONFIG_HOME into ~/AppData/aos.caddy, where this
# OS keeps a program's data: Caddy stores its certificates and keys in
# $XDG_DATA_HOME/caddy and its autosaved config in $XDG_CONFIG_HOME/caddy.
# It runs as the person, so it serves on ports 1024 and up; 80 and 443
# are the system's.
#
# No sandbox, like the other developer tools. The release's
# checksums.txt is sha512: it matched the download on 2026-11-05, and the
# sha256 below is of that same file. Apache-2.0. Fetched from GitHub,
# never mirrored.

recipe_version = 1

[package]
name         = "caddy"
organization = "aos"
version      = "2.11.9"
release      = 1
kind         = "bin"
summary      = "Caddy: a web server with automatic HTTPS, on ports 1024 and up here (80 and 443 are the system's)"
license      = "Apache-2.0"
homepage     = "https://caddyserver.com/"

[[source]]
url    = "https://github.com/caddyserver/caddy/releases/download/v2.11.9/caddy_2.11.9_linux_amd64.tar.gz"
sha256 = "5b8cb7faf8726a2028ad96a66e54e6e81e8f361bc6175e5d22bbd997cc5177fb"

[provides]
command = ["caddy"]

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D/libexec $D/bin
install -m 755 $APM_SRC/caddy $D/libexec/caddy
cat > $D/bin/caddy <<'WRAP'
#!/bin/sh
export XDG_DATA_HOME=$HOME/AppData/aos.caddy/data XDG_CONFIG_HOME=$HOME/AppData/aos.caddy/config
exec "$(dirname "$(readlink -f "$0")")/../libexec/caddy" "$@"
WRAP
chmod 755 $D/bin/caddy
'''
