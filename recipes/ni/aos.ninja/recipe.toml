# Ninja, the small build system that CMake and Meson generate for, from
# its own release: ninja-linux.zip holds the one static binary. Nothing
# to compile -- the install copies. The sha256 is of the asset as
# downloaded on 2026-10-26. Apache-2.0. Fetched from GitHub, never
# mirrored.

recipe_version = 1

[package]
name         = "ninja"
organization = "aos"
version      = "1.13.2"
release      = 1
kind         = "bin"
summary      = "Ninja: the small, fast build system CMake and Meson generate for"
license      = "Apache-2.0"
homepage     = "https://ninja-build.org/"
# A zip source: apm unpacks one since v0.1.35, which AOS 0.4.24 ships.
min_aos      = "0.4.24"

[[source]]
url    = "https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip"
sha256 = "5749cbc4e668273514150a80e387a957f933c6ed3f5f11e03fb30955e2bbead6"

[provides]
command = ["ninja"]

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D/bin
install -m 755 $APM_SRC/ninja $D/bin/ninja
'''
