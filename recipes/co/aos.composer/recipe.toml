# Composer, PHP's dependency manager, from getcomposer.org's own release:
# composer.phar is one PHP archive with a `#!/usr/bin/env php` stub, so it
# is installed as bin/composer as it is and runs with the php from
# Software's aos/php. COMPOSER_HOME goes to ~/AppData/aos.composer, where
# this OS keeps a program's data, through apm's [provides] env instead of
# a wrapper (the stub must stay the file's first line).
#
# No sandbox, like the other developer tools. The sha256 is the one in
# the .sha256sum file beside the download, checked against the download
# on 2026-11-05. MIT. Fetched from getcomposer.org, never mirrored.

recipe_version = 1

[package]
name         = "composer"
organization = "aos"
version      = "2.11.1"
release      = 1
kind         = "bin"
summary      = "Composer: dependency management for PHP projects"
license      = "MIT"
homepage     = "https://getcomposer.org/"
# [provides] env (apm v0.1.40, AOS 0.4.37).
min_aos      = "0.4.53"

[[source]]
url    = "https://getcomposer.org/download/2.11.1/composer.phar"
sha256 = "6f1b891e1d4927d62740276c540fb490e47689e19e102c49e8da849794882f8c"

[[dependencies]]
name         = "php"
organization = "aos"
track        = "*"

[provides]
command = ["composer"]
env     = ["COMPOSER_HOME=AppData/aos.composer"]

[build]
install = '''
D=$APM_DESTDIR$APM_PREFIX
install -d $D/bin
install -m 755 $APM_SRC/composer.phar $D/bin/composer
'''
